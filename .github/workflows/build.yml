name: Build Android and Windows Packages

on:
  release:
    # Stable releases emit both published and released; subscribe only once.
    types: [released]

permissions:
  contents: read

concurrency:
  group: packages-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.version.outputs.release_id }}
      build_needed: ${{ steps.version.outputs.build_needed }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ github.event.release.id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.308
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test update security and data-operation barrier
        run: dotnet test PasswordPhraseProducer.Updates.Tests/PasswordPhraseProducer.Updates.Tests.csproj -c Release
      - name: Test release publication and versioning
        run: python -m unittest discover -s Installer/tests -v
      - name: Test Android signing certificate verification
        shell: pwsh
        run: ./Installer/tests/Test-AndroidPackageVerification.ps1
      - name: Validate user-selected release and derive platform versions
        id: version
        run: python Installer/release_pipeline.py prepare --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --directory release-inputs
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build_needed == 'true'
        with:
          name: release-inputs
          path: release-inputs/release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.build_needed == 'true'
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      APP_BUILD: ${{ needs.prepare.outputs.build }}
      UPDATE_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.308
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/release-inputs
      - name: Configure temporary build paths
        shell: pwsh
        run: |
          "UPDATE_RELEASE_NOTES_FILE=$(Join-Path $env:RUNNER_TEMP 'release-inputs/release-notes.md')" >> $env:GITHUB_ENV
          "RELEASE_DIRECTORY=$(Join-Path $env:RUNNER_TEMP 'release')" >> $env:GITHUB_ENV
      - name: Require persistent signing keys for publication
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD','UPDATE_SIGNING_PRIVATE_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing permanent signing secret: $name" }
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV
      - name: Install build workloads and pinned Velopack tool
        shell: pwsh
        run: |
          dotnet workload install maui-windows maui-android
          if ($LASTEXITCODE -ne 0) { throw 'Workload installation failed.' }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Velopack tool restore failed.' }
      - name: Ensure Android SDK prerequisites
        shell: pwsh
        run: |
          dotnet build 'Password Phrase Producer/PasswordPhraseProducer.csproj' -t:InstallAndroidDependencies -f net9.0-android `
            -p:PppTargetFramework=net9.0-android -p:AcceptAndroidSdkLicenses=true "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK dependency installation failed.' }
      - name: Publish Windows application
        shell: pwsh
        run: |
          dotnet publish 'Password Phrase Producer/PasswordPhraseProducer.csproj' -c Release -f net9.0-windows10.0.19041.0 `
            -p:PppTargetFramework=net9.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true -p:ApplicationDisplayVersion=$env:APP_VERSION -p:ApplicationVersion=$env:APP_BUILD `
            -o "$env:RUNNER_TEMP/windows"
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed.' }
          dotnet vpk pack --packId Timbornemann.PasswordPhraseProducer --packTitle 'Password Phrase Producer' `
            --packVersion $env:APP_VERSION --packDir "$env:RUNNER_TEMP/windows" --mainExe PasswordPhraseProducer.exe `
            --runtime win-x64 --channel win-x64 --outputDir $env:RELEASE_DIRECTORY
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
      - name: Publish and verify signed Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish 'Password Phrase Producer/PasswordPhraseProducer.csproj' -c Release -f net9.0-android `
            -p:PppTargetFramework=net9.0-android -p:ApplicationDisplayVersion=$env:APP_VERSION -p:ApplicationVersion=$env:APP_BUILD `
            -p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE_PATH" "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS" `
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -o "$env:RUNNER_TEMP/android"
          if ($LASTEXITCODE -ne 0) { throw 'Android publish failed.' }
          $apk = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/android" -Filter '*-Signed.apk')
          if ($apk.Count -ne 1) { throw 'Expected exactly one signed APK.' }
          $buildTools = Get-ChildItem -LiteralPath "$env:ANDROID_HOME/build-tools" -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          & ./Installer/Verify-AndroidPackage.ps1 -Apk $apk[0].FullName -Version $env:APP_VERSION -BuildNumber $env:APP_BUILD `
            -FingerprintFile 'Password Phrase Producer/Resources/AndroidSigningCertificate.sha256' -BuildTools $buildTools.FullName
          Copy-Item -LiteralPath $apk[0].FullName -Destination "$env:RELEASE_DIRECTORY/Password-Phrase-Producer_$($env:APP_VERSION)_android_signed.apk"
      - name: Sign and verify complete release manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          dotnet run --project ReleaseTools/ReleaseTools.csproj -c Release -- manifest $env:APP_VERSION $env:APP_BUILD $env:RELEASE_DIRECTORY 'Password Phrase Producer/Resources/UpdateSigningPublicKey.pem'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest signing failed.' }
          dotnet run --project ReleaseTools/ReleaseTools.csproj -c Release -- verify $env:RELEASE_DIRECTORY 'Password Phrase Producer/Resources/UpdateSigningPublicKey.pem'
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_DIRECTORY }}/*-Setup.exe
            ${{ env.RELEASE_DIRECTORY }}/*-full.nupkg
            ${{ env.RELEASE_DIRECTORY }}/*_android_signed.apk
            ${{ env.RELEASE_DIRECTORY }}/update-manifest.json
            ${{ env.RELEASE_DIRECTORY }}/update-manifest.sig
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:ANDROID_KEYSTORE_PATH -and (Test-Path -LiteralPath $env:ANDROID_KEYSTORE_PATH)) {
            Remove-Item -LiteralPath $env:ANDROID_KEYSTORE_PATH -Force
          }

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.308
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release-assets
      - name: Build release verifier
        run: dotnet build ReleaseTools/ReleaseTools.csproj -c Release
      - name: Upload verified packages and publish update signature last
        run: python Installer/release_pipeline.py publish --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --directory release-assets
